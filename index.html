<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Natura & O Boticário — Catalog Data Explorer</title>
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "xv346eh4j2");
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .brand-natura   { color: #15803d; }
    .brand-boticario { color: #b45309; }
    .badge-complete { background:#dcfce7; color:#166534; }
    .badge-partial  { background:#fef9c3; color:#854d0e; }
    .badge-pending  { background:#f1f5f9; color:#64748b; }
    tr:hover td { background:#f8fafc; }
    .download-csv  { background:#16a34a; color:#fff; }
    .download-csv:hover  { background:#15803d; }
    .download-json { background:#2563eb; color:#fff; }
    .download-json:hover { background:#1d4ed8; }
    .stat-card { background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.2); }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- HEADER -->
  <header style="background:linear-gradient(135deg,#1e1b4b 0%,#4c1d95 60%,#7c3aed 100%)">
    <div class="max-w-7xl mx-auto px-6 py-10">
      <div class="flex items-start justify-between flex-wrap gap-4">
        <div>
          <h1 class="text-white text-3xl font-bold">Natura &amp; O Boticário</h1>
          <p class="text-violet-200 text-lg mt-1">Cosmetics Catalog Data Explorer</p>
        </div>
        <a href="https://github.com/arturovaine/cosmetics-catalogs"
           target="_blank"
           class="flex items-center gap-2 text-violet-200 hover:text-white text-sm mt-1 transition-colors">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
          </svg>
          View on GitHub
        </a>
      </div>

      <!-- STAT CARDS -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8">
        <div class="stat-card rounded-xl p-4 text-white">
          <p class="text-3xl font-bold">42</p>
          <p class="text-violet-200 text-sm mt-1">Catalogs</p>
        </div>
        <div class="stat-card rounded-xl p-4 text-white">
          <p class="text-3xl font-bold">49,356</p>
          <p class="text-violet-200 text-sm mt-1">Product records</p>
        </div>
        <div class="stat-card rounded-xl p-4 text-white">
          <p class="text-3xl font-bold">2</p>
          <p class="text-violet-200 text-sm mt-1">Brands</p>
        </div>
        <div class="stat-card rounded-xl p-4 text-white">
          <p class="text-3xl font-bold">2025–26</p>
          <p class="text-violet-200 text-sm mt-1">Coverage</p>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-7xl mx-auto px-6 py-8">

    <!-- FILTERS -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-6 flex flex-wrap gap-3 items-center">
      <input id="search" type="search" placeholder="Search catalog…"
             class="flex-1 min-w-48 border border-gray-200 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400" />

      <select id="filter-brand"
              class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400">
        <option value="">All brands</option>
        <option value="Natura">Natura</option>
        <option value="O Boticário">O Boticário</option>
      </select>

      <select id="filter-year"
              class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400">
        <option value="">All years</option>
        <option value="2025">2025</option>
        <option value="2026">2026</option>
      </select>

      <select id="filter-status"
              class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400">
        <option value="">All status</option>
        <option value="complete">Complete</option>
        <option value="partial">Partial</option>
        <option value="pending">Pending</option>
      </select>

      <span id="count-label" class="text-sm text-gray-400 ml-auto">40 catalogs</span>
    </div>

    <!-- TABLE -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-gray-100 text-left">
            <th class="px-5 py-3 text-gray-500 font-semibold cursor-pointer hover:text-gray-800 select-none" data-col="brand">Brand <span class="sort-icon">↕</span></th>
            <th class="px-5 py-3 text-gray-500 font-semibold text-center cursor-pointer hover:text-gray-800 select-none" data-col="cycle">Cycle <span class="sort-icon">↕</span></th>
            <th class="px-5 py-3 text-gray-500 font-semibold text-center cursor-pointer hover:text-gray-800 select-none" data-col="year">Year <span class="sort-icon">↕</span></th>
            <th class="px-5 py-3 text-gray-500 font-semibold text-right cursor-pointer hover:text-gray-800 select-none" data-col="products">Products <span class="sort-icon">↕</span></th>
            <th class="px-5 py-3 text-gray-500 font-semibold text-center">Status</th>
            <th class="px-5 py-3 text-gray-500 font-semibold text-center">Download</th>
          </tr>
        </thead>
        <tbody id="catalog-tbody"></tbody>
      </table>
      <div id="empty-msg" class="hidden text-center py-12 text-gray-400">No catalogs match the current filters.</div>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="max-w-7xl mx-auto px-6 py-8 mt-4 border-t border-gray-200">
    <div class="flex flex-wrap items-center justify-end gap-4 text-sm text-gray-400">
      <div class="flex gap-4">
        <a href="https://www.kaggle.com/datasets/arturovainecwb/natura-and-co-products-catalogs-20252026"
           target="_blank" class="hover:text-gray-700 transition-colors">Kaggle Dataset</a>
        <a href="https://github.com/arturovaine/cosmetics-catalogs"
           target="_blank" class="hover:text-gray-700 transition-colors">GitHub</a>
      </div>
    </div>
  </footer>

  <script>
    const CATALOGS = [
      {slug:'boticario-c02-2026', brand:'O Boticário', cycle:2,  year:2026, products:1626, status:'complete'},
      {slug:'boticario-c03-2026', brand:'O Boticário', cycle:3,  year:2026, products:33,   status:'partial'},
      {slug:'boticario-c04-2025', brand:'O Boticário', cycle:4,  year:2025, products:1345, status:'complete'},
      {slug:'boticario-c05-2025', brand:'O Boticário', cycle:5,  year:2025, products:1630, status:'complete'},
      {slug:'boticario-c06-2025', brand:'O Boticário', cycle:6,  year:2025, products:1651, status:'complete'},
      {slug:'boticario-c07-2025', brand:'O Boticário', cycle:7,  year:2025, products:1595, status:'complete'},
      {slug:'boticario-c08-2025', brand:'O Boticário', cycle:8,  year:2025, products:1604, status:'complete'},
      {slug:'boticario-c09-2025', brand:'O Boticário', cycle:9,  year:2025, products:1683, status:'complete'},
      {slug:'boticario-c10-2025', brand:'O Boticário', cycle:10, year:2025, products:1626, status:'complete'},
      {slug:'boticario-c11-2025', brand:'O Boticário', cycle:11, year:2025, products:1605, status:'complete'},
      {slug:'boticario-c12-2025', brand:'O Boticário', cycle:12, year:2025, products:1649, status:'complete'},
      {slug:'boticario-c13-2025', brand:'O Boticário', cycle:13, year:2025, products:1610, status:'complete'},
      {slug:'boticario-c14-2025', brand:'O Boticário', cycle:14, year:2025, products:1641, status:'complete'},
      {slug:'boticario-c15-2025', brand:'O Boticário', cycle:15, year:2025, products:1667, status:'complete'},
      {slug:'boticario-c16-2025', brand:'O Boticário', cycle:16, year:2025, products:1700, status:'complete'},
      {slug:'boticario-c17-2025', brand:'O Boticário', cycle:17, year:2025, products:1684, status:'complete'},
      {slug:'natura-c03-2025',    brand:'Natura',      cycle:3,  year:2025, products:1206, status:'complete'},
      {slug:'natura-c04-2025',    brand:'Natura',      cycle:4,  year:2025, products:1187, status:'complete'},
      {slug:'natura-c05-2025',    brand:'Natura',      cycle:5,  year:2025, products:891,  status:'complete'},
      {slug:'natura-c05-2026',    brand:'Natura',      cycle:5,  year:2026, products:1032, status:'complete'},
      {slug:'natura-c06-2025',    brand:'Natura',      cycle:6,  year:2025, products:1165, status:'complete'},
      {slug:'natura-c07-2025',    brand:'Natura',      cycle:7,  year:2025, products:1170, status:'complete'},
      {slug:'natura-c07-2026',    brand:'Natura',      cycle:7,  year:2026, products:218,  status:'partial'},
      {slug:'natura-c08-2025',    brand:'Natura',      cycle:8,  year:2025, products:1203, status:'complete'},
      {slug:'natura-c08-2026',    brand:'Natura',      cycle:8,  year:2026, products:0,    status:'pending'},
      {slug:'natura-c09-2025',    brand:'Natura',      cycle:9,  year:2025, products:1192, status:'complete'},
      {slug:'natura-c09-2026',    brand:'Natura',      cycle:9,  year:2026, products:0,    status:'pending'},
      {slug:'natura-c10-2025',    brand:'Natura',      cycle:10, year:2025, products:1227, status:'complete'},
      {slug:'natura-c10-2026',    brand:'Natura',      cycle:10, year:2026, products:0,    status:'pending'},
      {slug:'natura-c11-2026',    brand:'Natura',      cycle:11, year:2026, products:934,  status:'complete'},
      {slug:'natura-c12-2026',    brand:'Natura',      cycle:12, year:2026, products:1184, status:'complete'},
      {slug:'natura-c13-2026',    brand:'Natura',      cycle:13, year:2026, products:605,  status:'partial'},
      {slug:'natura-c12-2025',    brand:'Natura',      cycle:12, year:2025, products:1263, status:'complete'},
      {slug:'natura-c13-2025',    brand:'Natura',      cycle:13, year:2025, products:1201, status:'complete'},
      {slug:'natura-c14-2025',    brand:'Natura',      cycle:14, year:2025, products:1065, status:'complete'},
      {slug:'natura-c14-2026',    brand:'Natura',      cycle:14, year:2026, products:1134, status:'complete'},
      {slug:'natura-c15-2025',    brand:'Natura',      cycle:15, year:2025, products:1083, status:'complete'},
      {slug:'natura-c15-2026',    brand:'Natura',      cycle:15, year:2026, products:972,  status:'complete'},
      {slug:'natura-c16-2025',    brand:'Natura',      cycle:16, year:2025, products:1302, status:'complete'},
      {slug:'natura-c17-2025',    brand:'Natura',      cycle:17, year:2025, products:1258, status:'complete'},
      {slug:'natura-c18-2025',    brand:'Natura',      cycle:18, year:2025, products:1242, status:'complete'},
      {slug:'natura-c19-2025',    brand:'Natura',      cycle:19, year:2025, products:1273, status:'complete'},
    ];

    const STATUS_LABELS = {
      complete: 'Complete',
      partial:  'Partial',
      pending:  'Pending',
    };

    function renderTable(list) {
      const tbody = document.getElementById('catalog-tbody');
      const empty = document.getElementById('empty-msg');
      document.getElementById('count-label').textContent = `${list.length} catalog${list.length !== 1 ? 's' : ''}`;

      if (list.length === 0) {
        tbody.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      tbody.innerHTML = list.map(c => {
        const brandColor = c.brand === 'Natura' ? 'brand-natura' : 'brand-boticario';
        const badge = `badge-${c.status}`;
        const productsStr = c.products > 0 ? c.products.toLocaleString('pt-BR') : '—';
        const dlBase = `data/${c.slug}`;
        const csvBtn = `<a href="${dlBase}.csv" download
          class="download-csv inline-flex items-center gap-1 rounded-lg px-3 py-1.5 text-xs font-medium transition-colors">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>CSV</a>`;
        const jsonBtn = `<a href="${dlBase}.json" download
          class="download-json inline-flex items-center gap-1 rounded-lg px-3 py-1.5 text-xs font-medium transition-colors">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>JSON</a>`;

        return `<tr class="border-b border-gray-50">
          <td class="px-5 py-3 font-medium ${brandColor}">${c.brand}</td>
          <td class="px-5 py-3 text-center text-gray-700 font-mono">${String(c.cycle).padStart(2,'0')}</td>
          <td class="px-5 py-3 text-center text-gray-600">${c.year}</td>
          <td class="px-5 py-3 text-right font-mono text-gray-800">${productsStr}</td>
          <td class="px-5 py-3 text-center">
            <span class="${badge} text-xs font-medium px-2.5 py-1 rounded-full">${STATUS_LABELS[c.status]}</span>
          </td>
          <td class="px-5 py-3 text-center">
            <div class="flex gap-2 justify-center flex-wrap">${csvBtn}${jsonBtn}</div>
          </td>
        </tr>`;
      }).join('');
    }

    // Sorting state: default = year desc, cycle desc (most recent first)
    let sortCol = 'year', sortDir = -1;

    function sortList(list) {
      return [...list].sort((a, b) => {
        let av = a[sortCol], bv = b[sortCol];
        if (typeof av === 'string') av = av.toLowerCase(), bv = bv.toLowerCase();
        if (av < bv) return -sortDir;
        if (av > bv) return  sortDir;
        // secondary: cycle desc
        if (sortCol !== 'cycle') return b.cycle - a.cycle;
        return 0;
      });
    }

    function updateSortIcons() {
      document.querySelectorAll('th[data-col]').forEach(th => {
        const icon = th.querySelector('.sort-icon');
        if (th.dataset.col === sortCol) icon.textContent = sortDir === 1 ? '↑' : '↓';
        else icon.textContent = '↕';
      });
    }

    function applyFilters() {
      const q      = document.getElementById('search').value.toLowerCase();
      const brand  = document.getElementById('filter-brand').value;
      const year   = document.getElementById('filter-year').value;
      const status = document.getElementById('filter-status').value;

      const filtered = CATALOGS.filter(c => {
        const label = `${c.brand} cycle ${String(c.cycle).padStart(2,'0')} ${c.year}`.toLowerCase();
        if (q && !label.includes(q)) return false;
        if (brand && c.brand !== brand) return false;
        if (year && c.year !== parseInt(year)) return false;
        if (status && c.status !== status) return false;
        return true;
      });
      renderTable(sortList(filtered));
    }

    document.querySelectorAll('th[data-col]').forEach(th => {
      th.addEventListener('click', () => {
        if (sortCol === th.dataset.col) sortDir *= -1;
        else { sortCol = th.dataset.col; sortDir = th.dataset.col === 'brand' ? 1 : -1; }
        updateSortIcons();
        applyFilters();
      });
    });

    ['search','filter-brand','filter-year','filter-status'].forEach(id =>
      document.getElementById(id).addEventListener('input', applyFilters)
    );

    updateSortIcons();
    applyFilters();
  </script>
</body>
</html>
